packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@types/node': ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: ^0.1.24
  file-type: ^22.0.1
  pdf-parse: ^2.4.5
  vite-plugin-static-copy: ^4.1.1
  jsdom: ^29.1.1
  happy-dom: ^20.10.6
  '@file-type/xml': ^1.1.1
  papaparse: ^5.5.4
  '@types/papaparse': ^5.5.2
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
