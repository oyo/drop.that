<!doctype html>
<html>

<head>
  <title>drop.that</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <script type="module">
    import { dropIn, dropOut, valid } from './lib.js'

    const input = JSON.parse(
      await dropIn({
        showUI: false,
        autoStart: true,
        apiIn: 'https://api.restful-api.dev/objects/7',
        valid: valid.isJSON,
        startButtonText: 'wordcount'
      })
    )

    const output = {
      ...input,
      data: {
        ...input.data,
        year: input.data.year + 1,
        price: Math.round(input.data.price * 1.1)
      }
    }
    const outstr = JSON.stringify(output, null, 2)
    await dropOut(outstr, {
      apiMethod: 'POST',
      apiOut: 'https://api.restful-api.dev/objects/7',
      apiOutMimeType: 'application/json'
    })
  </script>
</body>

</html>
