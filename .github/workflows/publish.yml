# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: get npm tag
        id: npm_tag
        run: echo "current_version=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT

      - name: check if git and npm tags match
        if: ${{ github.ref_name != steps.npm_tag.outputs.current_version }}
        run: echo "GIT ${{ github.ref_name }} != NPM ${{ steps.npm_tag.outputs.current_version }}" && exit 1

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: install dependencies
        run: vp install

      - name: check, test & build
        run: vp run ready

      - name: Publish library to NPM
        run: npm publish --provenance --access public
        working-directory: ./packages/drop.that
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload webapp
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/website/dist'

      - name: deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
